<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>物品审核 - 后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .header { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; color: #fff; }
        .header a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 6px; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #94a3b8; font-size: 14px; font-weight: 600; }
        td { color: #e2e8f0; font-size: 15px; }

        .btn-approve { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s; margin-right: 10px;}
        .btn-approve:hover { background: #10b981; color: white; }
        .btn-delete { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn-delete:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>
<div class="header">
    <h1>物品审核管理</h1>
    <a href="/admin/index">返回数据看板</a>
</div>
<div class="container">
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>物品标题</th>
                <th>价格</th>
                <th>状态</th>
                <th>发布时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="g : ${goodsList}">
                <td th:text="${g.id}">1</td>
                <td th:text="${g.title}">物品标题</td>
                <td>￥<span th:text="${g.price}">0.00</span></td>
                <td>
                    <span th:if="${g.status == 1}" style="color: #10b981;">在售</span>
                    <span th:if="${g.status == 0}" style="color: #ef4444;">已下架</span>
                    <span th:if="${g.status == 2}" style="color: #94a3b8;">已售出</span>
                </td>
                <td th:text="${#dates.format(g.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                <td>
                    <!-- 🚨 新增：审核通过按钮 -->
                    <form action="/admin/goods/approve" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${g.id}">
                        <button type="submit" class="btn-approve">审核通过</button>
                    </form>

                    <form action="/admin/goods/delete" method="post" onsubmit="return confirm('确定要强制下架并删除该物品吗？');" style="display:inline;">
                        <input type="hidden" name="id" th:value="${g.id}">
                        <button type="submit" class="btn-delete">强制删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
