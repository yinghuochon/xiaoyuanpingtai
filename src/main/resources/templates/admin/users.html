<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户管理 - 后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 24px; color: #fff; }
    .header a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 6px; }
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .card { background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { color: #94a3b8; font-size: 14px; font-weight: 600; }
    td { color: #e2e8f0; font-size: 15px; }
    .tag-admin { background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag-user { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
<div class="header">
  <h1>用户管理</h1>
  <a href="/admin/index">返回数据看板</a>
</div>
<div class="container">
  <div class="card">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>昵称</th>
        <th>邮箱</th>
        <th>角色</th>
        <th>注册时间</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.username}">admin</td>
        <td th:text="${u.nickname}">管理员</td>
        <td th:text="${u.email != null ? u.email : '未填写'}">未填写</td>
        <td>
          <span th:if="${u.role == 'ADMIN'}" class="tag-admin">管理员</span>
          <span th:if="${u.role == 'USER'}" class="tag-user">普通用户</span>
        </td>
        <td th:text="${#dates.format(u.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
