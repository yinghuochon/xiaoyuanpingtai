<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>私聊 - 校园二手闲置交易平台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 800px; height: 80vh; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; background: rgba(15, 23, 42, 0.6); display: flex; flex-direction: column; gap: 20px; }

        .msg-row { display: flex; align-items: flex-start; gap: 12px; }
        .msg-row.right { flex-direction: row-reverse; }

        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; flex-shrink: 0; }
        .msg-row.right .avatar { background: #10b981; }

        .bubble { max-width: 65%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-all; }
        .msg-row.left .bubble { background: #334155; border: 1px solid rgba(255,255,255,0.05); border-top-left-radius: 2px; }
        .msg-row.right .bubble { background: #3b82f6; color: #fff; border-top-right-radius: 2px; }
        .time { font-size: 12px; color: #64748b; text-align: center; margin: 10px 0; }

        .chat-footer { padding: 15px 20px; background: rgba(30, 41, 59, 0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 12px; flex-shrink: 0; }
        .chat-footer input { flex: 1; padding: 12px 20px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; outline: none; font-size: 14px; color: #fff; }
        .chat-footer input:focus { border-color: #3b82f6; }
        .chat-footer button { background: #3b82f6; color: white; border: none; padding: 0 30px; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <!-- 头部显示对方的昵称 -->
        <h3>与 <span th:text="${seller.nickname != null ? seller.nickname : seller.username}"></span> 私聊中...</h3>
        <a th:href="@{/goods/detail/{id}(id=${goods.id})}" style="color: white; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px;">返回商品详情</a>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="time">聊天记录</div>

        <!-- 🚨 核心修复：判断是否是自己发的消息 -->
        <div th:each="msg : ${messages}" class="msg-row" th:classappend="${msg.senderId == currentUser.id} ? 'right' : 'left'">

            <!-- 左侧：如果是对方发的，显示对方头像 -->
            <div th:if="${msg.senderId != currentUser.id}">
                <img th:if="${seller.avatar != null and seller.avatar != ''}" th:src="${seller.avatar}" class="avatar" style="object-fit:cover;" />
                <div th:if="${seller.avatar == null or seller.avatar == ''}" class="avatar" th:text="${#strings.substring(seller.username, 0, 1).toUpperCase()}"></div>
            </div>

            <!-- 右侧：如果是自己发的，显示自己头像 -->
            <div th:if="${msg.senderId == currentUser.id}">
                <img th:if="${currentUser.avatar != null and currentUser.avatar != ''}" th:src="${currentUser.avatar}" class="avatar" style="object-fit:cover;" />
                <div th:if="${currentUser.avatar == null or currentUser.avatar == ''}" class="avatar" th:text="${#strings.substring(currentUser.username, 0, 1).toUpperCase()}"></div>
            </div>

            <div class="bubble" th:text="${msg.content}">你好，这件物品还在吗？</div>
        </div>

        <div th:if="${messages.size() == 0}" class="time" style="margin-top: 50px;">
            暂无聊天记录，快发一条消息打个招呼吧！
        </div>
    </div>

    <div class="chat-footer">
        <form action="/chat/send" method="post" style="display: flex; width: 100%; gap: 12px;">
            <input type="hidden" name="goodsId" th:value="${goods.id}">
            <input type="hidden" name="receiverId" th:value="${seller.id}">
            <input type="text" name="content" placeholder="输入消息，按回车发送..." required autocomplete="off">
            <button type="submit">发送</button>
        </form>
    </div>
</div>

<script>
    const chatBody = document.getElementById('chatBody');
    chatBody.scrollTop = chatBody.scrollHeight;
</script>

</body>
</html>
