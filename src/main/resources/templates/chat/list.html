<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的私信 - 校园二手闲置交易平台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); background-attachment: fixed; color: #e2e8f0; min-height: 100vh; }

        .navbar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 40px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 20px; color: #fff; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; font-size: 14px; }
        .nav-links a { text-decoration: none; color: rgba(255,255,255,0.7); transition: color 0.2s; }
        .nav-links a:hover { color: #fff; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .title { font-size: 24px; color: #f8fafc; margin-bottom: 20px; font-weight: 600; }

        /* 切换标签 */
        .tabs { display: flex; gap: 15px; margin-bottom: 20px; }
        .tab-btn { background: rgba(255,255,255,0.1); color: #cbd5e1; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .tab-btn:hover { background: rgba(255,255,255,0.2); }
        .tab-btn.active { background: #10b981; color: white; }

        .chat-list { display: flex; flex-direction: column; gap: 15px; }

        .chat-item {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #10b981; /* 绿色边框代表私聊 */
            transition: transform 0.2s;
        }
        .chat-item:hover { transform: translateX(5px); }

        .chat-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #94a3b8; }
        .chat-header .buyer { color: #10b981; font-weight: bold; }

        .goods-link { color: #38bdf8; text-decoration: none; border-bottom: 1px dashed #38bdf8; }
        .goods-link:hover { color: #7dd3fc; }

        .chat-content { font-size: 15px; color: #e2e8f0; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 8px; margin-top: 10px; }

        .btn-reply { display: inline-block; margin-top: 10px; background: #3b82f6; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; }
        .btn-reply:hover { background: #2563eb; }

        .empty-state { text-align: center; color: #64748b; padding: 60px 0; font-size: 16px; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/goods/" style="text-decoration: none;"><h1>校园二手闲置交易平台</h1></a>
    <div class="nav-links">
        <a href="/goods/">返回首页</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <h2 class="title">💬 消息中心</h2>

    <!-- 切换按钮 -->
    <div class="tabs">
        <a href="/user/messages" class="tab-btn">物品留言</a>
        <a href="/chat/list" class="tab-btn active">我的私信</a>
    </div>

    <div class="chat-list" th:if="${chatList.size() > 0}">
        <div class="chat-item" th:each="chat : ${chatList}">
            <div class="chat-header">
                <span>来自：<span class="buyer" th:text="${chat.senderName}">买家昵称</span>
                    <!-- 🚨 新增：未读小红点 -->
                    <span th:if="${chat.isRead == 0}" style="background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px;">新</span>
                </span>
                <span th:text="${#dates.format(chat.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01</span>
            </div>
            <div>
                针对物品：
                <a class="goods-link" th:href="@{/chat/room/{goodsId}/{sellerId}(goodsId=${chat.goodsId}, sellerId=${chat.senderId})}" th:text="${chat.goodsTitle}">物品标题</a>
            </div>
            <div class="chat-content" th:text="${chat.content}">私信内容</div>

            <a th:href="@{/chat/room/{goodsId}/{sellerId}(goodsId=${chat.goodsId}, sellerId=${chat.senderId})}" class="btn-reply">进入聊天室回复</a>
        </div>
    </div>

    <div class="empty-state" th:if="${chatList.size() == 0}">
        暂时没有收到私信哦~
    </div>
</div>

</body>
</html>
