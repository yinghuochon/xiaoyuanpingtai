<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>发布闲置物品 - 校园二手闲置交易平台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 🚨 核心修改：加入深蓝渐变 + 动态星空背景 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      background-attachment: fixed;
      position: relative;
      padding: 20px;
    }

    /* 🚨 星空闪烁动画核心代码 */
    @keyframes twinkle {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background-image:
              radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
              radial-gradient(1.5px 1.5px at 40px 70px, #fff, rgba(0,0,0,0)),
              radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
              radial-gradient(2.5px 2.5px at 160px 120px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
              radial-gradient(1.5px 1.5px at 200px 60px, #fff, rgba(0,0,0,0)),
              radial-gradient(2px 2px at 250px 150px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      /* 🚨 挂载动画 */
      animation: twinkle 4s infinite alternate;
    }

    /* 卡片主体容器 */
    .publish-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 50px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .header { text-align: center; margin-bottom: 30px; }
    .header h2 { font-size: 28px; color: #0f172a; font-weight: 800; letter-spacing: 2px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width { grid-column: span 2; }

    .form-group { display: block; }
    .form-group label { display: block; margin-bottom: 8px; color: #334155; font-size: 15px; font-weight: 600; }

    .form-control {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #f8fafc;
      color: #1e293b;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: #3b82f6;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    textarea.form-control { resize: vertical; min-height: 100px; }

    .file-upload-wrapper { position: relative; width: 100%; }
    .file-upload-btn {
      width: 100%;
      padding: 20px;
      background: #f1f5f9;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      color: #64748b;
      font-size: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .file-upload-btn:hover { background: #e2e8f0; border-color: #3b82f6; color: #3b82f6; }
    .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: all 0.3s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4); }

    .btn-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #64748b;
      font-size: 14px;
      transition: color 0.2s;
    }
    .btn-back:hover { color: #0f172a; }
  </style>
</head>
<body>

<div class="publish-card">
  <div class="header">
    <h2>✨ 发布闲置物品</h2>
  </div>

  <form action="/goods/publish" method="post" enctype="multipart/form-data">
    <div class="form-grid">
      <div class="form-group">
        <label>物品标题</label>
        <input type="text" name="title" class="form-control" placeholder="例如：九成新考研英语真题" required>
      </div>

      <div class="form-group">
        <label>物品价格 (￥)</label>
        <input type="number" step="0.01" name="price" class="form-control" placeholder="请输入价格" required>
      </div>

      <div class="form-group full-width">
        <label>物品描述</label>
        <textarea name="description" class="form-control" placeholder="请详细描述物品的新旧程度、交易地点等信息..." required></textarea>
      </div>

      <div class="form-group">
        <label>物品分类 (数字)</label>
        <input type="number" name="categoryId" class="form-control" value="1" placeholder="1数码 2图书 3生活 4运动" required>
      </div>

      <div class="form-group full-width">
        <label>上传图片</label>
        <div class="file-upload-wrapper">
          <div class="file-upload-btn">点击此处选择图片 📁</div>
          <input type="file" name="files" multiple required>
        </div>
      </div>
    </div>

    <button type="submit" class="btn-submit">确认发布</button>
    <a href="/goods/" class="btn-back">← 返回首页</a>
  </form>
</div>

</body>
<!-- ========================================== -->
<!-- 🚨 首页同款：深空渐变 + 繁星 + 流星雨特效 -->
<!-- ========================================== -->
<div id="galaxy-bg" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);">

  <!-- 1. 繁星层 -->
  <div class="stars star-small"></div>
  <div class="stars star-medium"></div>
  <div class="stars star-large"></div>

  <!-- 2. 流星雨层 (10颗彩色流星) -->
  <div class="meteors-layer">
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
  </div>
</div>

<style>
  /* 繁星层 */
  .stars { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: transparent; }

  .star-small {
    width: 1px; height: 1px;
    box-shadow: 10vw 20vh #FFF, 30vw 40vh #FFF, 50vw 60vh #FFF, 70vw 80vh #FFF, 90vw 10vh #FFF, 20vw 70vh #FFF, 40vw 90vh #FFF, 60vw 30vh #FFF, 80vw 50vh #FFF, 15vw 55vh #FFF, 35vw 15vh #FFF, 55vw 75vh #FFF, 75vw 25vh #FFF, 95vw 65vh #FFF, 5vw 85vh #FFF;
    animation: twinkle-slow 4s infinite alternate;
  }

  .star-medium {
    width: 2px; height: 2px;
    box-shadow: 15vw 25vh #FFF, 35vw 75vh #FFF, 65vw 15vh #FFF, 85vw 55vh #FFF, 5vw 45vh #FFF, 25vw 85vh #FFF, 55vw 35vh #FFF, 75vw 65vh #FFF, 95vw 5vh #FFF, 45vw 95vh #FFF;
    animation: twinkle-medium 3s infinite alternate;
  }

  .star-large {
    width: 3px; height: 3px;
    filter: drop-shadow(0 0 6px #fff);
    box-shadow: 20vw 50vh #FFF, 50vw 10vh #FFF, 80vw 70vh #FFF, 10vw 80vh #FFF, 70vw 20vh #FFF, 40vw 30vh #FFF, 90vw 40vh #FFF, 30vw 90vh #FFF;
    animation: twinkle-fast 2s infinite alternate;
  }

  @keyframes twinkle-slow { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }
  @keyframes twinkle-medium { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
  @keyframes twinkle-fast { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 1; transform: scale(1.5); } }

  /* 流星雨层 */
  .meteor { position: absolute; width: 160px; height: 2px; opacity: 0; transform: rotate(-45deg); }
  .meteor:nth-child(1), .meteor:nth-child(2), .meteor:nth-child(3) { background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
  .meteor:nth-child(4), .meteor:nth-child(5), .meteor:nth-child(6) { background: linear-gradient(90deg, #e0c3fc, rgba(224,195,252,0)); box-shadow: 0 0 10px rgba(224,195,252,0.8); }
  .meteor:nth-child(7), .meteor:nth-child(8), .meteor:nth-child(9) { background: linear-gradient(90deg, #8ec5fc, rgba(142,197,252,0)); box-shadow: 0 0 10px rgba(142,197,252,0.8); }
  .meteor:nth-child(10) { background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); }

  .meteor:nth-child(1) { top: -10%; left: 10%; animation: meteor-fall 4s linear infinite; animation-delay: 0s; }
  .meteor:nth-child(2) { top: -10%; left: 40%; animation: meteor-fall 6s linear infinite; animation-delay: 2s; }
  .meteor:nth-child(3) { top: -10%; left: 70%; animation: meteor-fall 5s linear infinite; animation-delay: 4s; }
  .meteor:nth-child(4) { top: -10%; left: 20%; animation: meteor-fall 7s linear infinite; animation-delay: 1s; }
  .meteor:nth-child(5) { top: -10%; left: 50%; animation: meteor-fall 4.5s linear infinite; animation-delay: 3s; }
  .meteor:nth-child(6) { top: -10%; left: 80%; animation: meteor-fall 8s linear infinite; animation-delay: 5s; }
  .meteor:nth-child(7) { top: -10%; left: 30%; animation: meteor-fall 5.5s linear infinite; animation-delay: 6s; }
  .meteor:nth-child(8) { top: -10%; left: 60%; animation: meteor-fall 7.5s linear infinite; animation-delay: 7s; }
  .meteor:nth-child(9) { top: -10%; left: 90%; animation: meteor-fall 6.5s linear infinite; animation-delay: 8s; }
  .meteor:nth-child(10) { top: -10%; left: 45%; animation: meteor-fall 9s linear infinite; animation-delay: 1.5s; }

  @keyframes meteor-fall {
    0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
    20% { transform: translateX(-600px) translateY(600px) rotate(-45deg); opacity: 0; }
    100% { opacity: 0; }
  }
</style>
<!-- ========================================== -->
<!-- 🚨 特效代码结束 -->
<!-- ========================================== -->
</html>
