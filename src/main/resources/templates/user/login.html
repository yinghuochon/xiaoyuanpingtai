<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 校园二手闲置交易平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 核心：保留极光渐变背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
        }

        /* ==========================================
           🚨 星空与流星特效层
           ========================================== */
        .star-sky {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* 1. 静态闪烁星星 (用 box-shadow 生成满屏星星) */
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow:
                    10vw 20vh 0 0px rgba(255,255,255,0.8),
                    20vw 80vh 0 0px rgba(255,255,255,0.6),
                    30vw 40vh 0 1px rgba(255,255,255,0.9),
                    40vw 10vh 0 0px rgba(255,255,255,0.5),
                    50vw 70vh 0 1px rgba(255,255,255,0.8),
                    60vw 30vh 0 0px rgba(255,255,255,0.7),
                    70vw 90vh 0 0px rgba(255,255,255,0.6),
                    80vw 50vh 0 1px rgba(255,255,255,0.9),
                    90vw 15vh 0 0px rgba(255,255,255,0.8),
                    15vw 60vh 0 0px rgba(255,255,255,0.5),
                    35vw 85vh 0 1px rgba(255,255,255,0.7),
                    65vw 15vh 0 0px rgba(255,255,255,0.6),
                    85vw 75vh 0 1px rgba(255,255,255,0.8);
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* 2. 流星划过特效 */
        .meteor {
            position: absolute;
            width: 150px; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            transform: rotate(-45deg);
            opacity: 0;
            animation: meteor-fall 6s linear infinite;
        }

        /* 设置三颗流星不同的位置和延迟，看起来更真实 */
        .meteor:nth-child(2) { top: 10%; left: 80%; animation-delay: 0s; }
        .meteor:nth-child(3) { top: 30%; left: 90%; animation-delay: 3s; animation-duration: 8s; }
        .meteor:nth-child(4) { top: -10%; left: 60%; animation-delay: 5s; animation-duration: 5s; }

        @keyframes meteor-fall {
            0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
            20% { transform: translateX(-400px) translateY(400px) rotate(-45deg); opacity: 0; }
            100% { opacity: 0; }
        }

        /* 3. 原有的背景光晕（可以保留作为氛围光） */
        .circle { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.05); }
        .circle-1 { width: 400px; height: 400px; top: -150px; left: -100px; }
        .circle-2 { width: 300px; height: 300px; bottom: -100px; right: -50px; }

        /* ==========================================
           登录卡片样式
           ========================================== */
        .login-box {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            width: 400px;
            z-index: 10;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 顶部横幅 */
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .login-header h2 { font-size: 24px; font-weight: 600; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .login-header p { font-size: 13px; color: rgba(255, 255, 255, 0.85); display: flex; justify-content: center; align-items: center; gap: 5px; }

        .login-body { padding: 30px 35px 40px 35px; }

        /* 提示信息 */
        .error { color: #e03131; font-size: 13px; text-align: center; margin-bottom: 15px; background: #ffe3e3; padding: 10px; border-radius: 8px; }
        .success { color: #2f9e44; font-size: 13px; text-align: center; margin-bottom: 15px; background: #ebfbee; padding: 10px; border-radius: 8px; }

        /* 输入框 */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-size: 13px; font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .form-group input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.3s; background: #f8f9fa; }
        .form-group input:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }

        /* 记住我和忘记密码 */
        .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 20px; }
        .form-options label { display: flex; align-items: center; gap: 6px; color: #64748b; cursor: pointer; user-select: none; }
        .form-options input[type="checkbox"] { accent-color: #667eea; width: 14px; height: 14px; cursor: pointer; }
        .form-options a { color: #667eea; text-decoration: none; transition: color 0.2s; }
        .form-options a:hover { color: #764ba2; text-decoration: underline; }

        /* 登录按钮 */
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: opacity 0.3s, transform 0.1s; box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }

        /* 管理员按钮 */
        .btn-admin { background: linear-gradient(135deg, #20c997 0%, #12b886 100%); margin-top: 15px; box-shadow: 0 4px 15px rgba(18, 184, 134, 0.3); }

        /* 分割线 */
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #adb5bd; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e1e4e8; }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        /* 注册链接 */
        .register-link { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .register-link:hover { color: #764ba2; text-decoration: underline; }
    </style>
</head>
<body>

<!-- 🚨 星空与流星层 -->
<div class="star-sky">
    <div class="star"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
</div>

<!-- 背景光晕 -->
<div class="circle circle-1"></div>
<div class="circle circle-2"></div>

<!-- 登录卡片 -->
<div class="login-box">
    <div class="login-header">
        <h2>校园二手闲置交易平台</h2>
        <p><i class="fa-solid fa-shield-halved"></i> 官方认证 · 安全交易</p>
    </div>

    <div class="login-body">
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${msg}" th:text="${msg}"></div>

        <!-- 登录表单 -->
        <form action="/doLogin" method="post" id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" required placeholder="请输入您的用户名">
                </div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" required placeholder="请输入您的密码">
                </div>
            </div>

            <!-- 记住我和忘记密码 -->
            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember-me"> 记住我
                </label>
                <a href="javascript:void(0);" onclick="forgotPassword()">忘记密码？</a>
            </div>

            <button type="submit" class="btn">登 录</button>
        </form>

        <div class="divider">或</div>

        <!-- 一键管理员登录 -->
        <button type="button" class="btn btn-admin" onclick="adminLogin()">管理员一键登录</button>

        <a href="/register" class="register-link">没有账号？去注册 →</a>
    </div>
</div>

<script>
    function adminLogin() {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = '123456';
        document.getElementById('loginForm').submit();
    }

    function forgotPassword() {
        alert("请联系系统管理员进行密码重置！\n管理员邮箱：admin@campus.com");
    }
</script>

</body>
<!-- ========================================== -->
<!-- 🚨 梦幻星系 + 渐变深空 + 繁星流星 (全站通用) -->
<!-- ========================================== -->
<div id="galaxy-bg" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; background: linear-gradient(135deg, #0b132b 0%, #1c2541 40%, #3a506b 100%);">

    <!-- 1. 梦幻星系层 (高亮渐变星云) -->
    <div class="galaxy-cloud cloud-1"></div>
    <div class="galaxy-cloud cloud-2"></div>
    <div class="galaxy-cloud cloud-3"></div>
    <div class="galaxy-cloud cloud-4"></div>

    <!-- 2. 繁星层 (散布全屏) -->
    <div class="stars star-small"></div>
    <div class="stars star-medium"></div>
    <div class="stars star-large"></div>

    <!-- 3. 流星雨层 (10颗流星) -->
    <div class="meteors-layer">
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
        <div class="meteor"></div>
    </div>
</div>

<style>
    /* --- 1. 梦幻星系云团 --- */
    .galaxy-cloud { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: float 20s infinite alternate; }
    /* 深蓝云团 */
    .cloud-1 { width: 700px; height: 700px; background: #4f46e5; top: -10%; left: -10%; animation-delay: 0s; }
    /* 青绿云团 */
    .cloud-2 { width: 500px; height: 500px; background: #06b6d4; top: 40%; right: -10%; animation-delay: -5s; }
    /* 紫红云团 */
    .cloud-3 { width: 600px; height: 600px; background: #9333ea; bottom: -20%; left: 20%; animation-delay: -10s; opacity: 0.4; }
    /* 点缀的亮蓝云团 */
    .cloud-4 { width: 300px; height: 300px; background: #3b82f6; top: 20%; left: 60%; animation-delay: -15s; opacity: 0.5; }

    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 80px) scale(1.1); } }

    /* --- 2. 满天繁星 --- */
    .stars { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: transparent; }

    .star-small {
        width: 1px; height: 1px;
        box-shadow:
                10vw 20vh #FFF, 30vw 40vh #FFF, 50vw 60vh #FFF, 70vw 80vh #FFF, 90vw 10vh #FFF,
                20vw 70vh #FFF, 40vw 90vh #FFF, 60vw 30vh #FFF, 80vw 50vh #FFF, 15vw 55vh #FFF,
                35vw 15vh #FFF, 55vw 75vh #FFF, 75vw 25vh #FFF, 95vw 65vh #FFF, 5vw 85vh #FFF;
        animation: twinkle-slow 4s infinite alternate;
    }

    .star-medium {
        width: 2px; height: 2px;
        box-shadow:
                15vw 25vh #FFF, 35vw 75vh #FFF, 65vw 15vh #FFF, 85vw 55vh #FFF, 5vw 45vh #FFF,
                25vw 85vh #FFF, 55vw 35vh #FFF, 75vw 65vh #FFF, 95vw 5vh #FFF, 45vw 95vh #FFF;
        animation: twinkle-medium 3s infinite alternate;
    }

    .star-large {
        width: 3px; height: 3px;
        filter: drop-shadow(0 0 6px #fff);
        box-shadow:
                20vw 50vh #FFF, 50vw 10vh #FFF, 80vw 70vh #FFF, 10vw 80vh #FFF, 70vw 20vh #FFF,
                40vw 30vh #FFF, 90vw 40vh #FFF, 30vw 90vh #FFF;
        animation: twinkle-fast 2s infinite alternate;
    }

    @keyframes twinkle-slow { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }
    @keyframes twinkle-medium { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
    @keyframes twinkle-fast { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 1; transform: scale(1.5); } }

    /* --- 3. 流星雨 --- */
    .meteor { position: absolute; width: 160px; height: 2px; opacity: 0; transform: rotate(-45deg); }
    .meteor:nth-child(1), .meteor:nth-child(2), .meteor:nth-child(3) { background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
    .meteor:nth-child(4), .meteor:nth-child(5), .meteor:nth-child(6) { background: linear-gradient(90deg, #e0c3fc, rgba(224,195,252,0)); box-shadow: 0 0 10px rgba(224,195,252,0.8); }
    .meteor:nth-child(7), .meteor:nth-child(8), .meteor:nth-child(9) { background: linear-gradient(90deg, #8ec5fc, rgba(142,197,252,0)); box-shadow: 0 0 10px rgba(142,197,252,0.8); }
    .meteor:nth-child(10) { background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); }

    .meteor:nth-child(1) { top: -10%; left: 10%; animation: meteor-fall 4s linear infinite; animation-delay: 0s; }
    .meteor:nth-child(2) { top: -10%; left: 40%; animation: meteor-fall 6s linear infinite; animation-delay: 2s; }
    .meteor:nth-child(3) { top: -10%; left: 70%; animation: meteor-fall 5s linear infinite; animation-delay: 4s; }
    .meteor:nth-child(4) { top: -10%; left: 20%; animation: meteor-fall 7s linear infinite; animation-delay: 1s; }
    .meteor:nth-child(5) { top: -10%; left: 50%; animation: meteor-fall 4.5s linear infinite; animation-delay: 3s; }
    .meteor:nth-child(6) { top: -10%; left: 80%; animation: meteor-fall 8s linear infinite; animation-delay: 5s; }
    .meteor:nth-child(7) { top: -10%; left: 30%; animation: meteor-fall 5.5s linear infinite; animation-delay: 6s; }
    .meteor:nth-child(8) { top: -10%; left: 60%; animation: meteor-fall 7.5s linear infinite; animation-delay: 7s; }
    .meteor:nth-child(9) { top: -10%; left: 90%; animation: meteor-fall 6.5s linear infinite; animation-delay: 8s; }
    .meteor:nth-child(10) { top: -10%; left: 45%; animation: meteor-fall 9s linear infinite; animation-delay: 1.5s; }

    @keyframes meteor-fall {
        0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
        20% { transform: translateX(-600px) translateY(600px) rotate(-45deg); opacity: 0; }
        100% { opacity: 0; }
    }
</style>
<!-- ========================================== -->
<!-- 🚨 特效代码结束 -->
<!-- ========================================== -->
</html>
