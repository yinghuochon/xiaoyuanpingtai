<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>校园二手闲置交易平台 - 注册</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100vh !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%) !important;
            display: flex; justify-content: center; align-items: center;
        }
        body::before {
            content: ''; position: fixed; top: -20%; left: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.4) 0%, transparent 60%); z-index: -1;
        }
        body::after {
            content: ''; position: fixed; bottom: -20%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.3) 0%, transparent 60%); z-index: -1;
        }
        .register-card {
            background: #ffffff; border-radius: 20px; padding: 40px;
            width: 100%; max-width: 450px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { font-size: 26px; color: #0f172a; font-weight: 800; letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #334155; font-size: 14px; font-weight: 600; }
        .form-control {
            width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-size: 15px; outline: none; background: #f8fafc; color: #1e293b; transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .btn-submit {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); }
        .error { color: #e03131; font-size: 14px; text-align: center; margin-bottom: 15px; background: #ffe3e3; padding: 10px; border-radius: 8px; }
        .success { color: #2f9e44; font-size: 14px; text-align: center; margin-bottom: 15px; background: #ebfbee; padding: 10px; border-radius: 8px; }
        .login-link { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #64748b; font-size: 14px; }
        .login-link:hover { color: #3b82f6; }
    </style>
</head>
<body>
<div class="register-card">
    <div class="header">
        <h2>✨ 用户注册</h2>
    </div>

    <!-- 错误/成功提示 -->
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="success" th:if="${success}" th:text="${success}"></div>

    <form action="/doRegister" method="post">
        <div class="form-group">
            <label>用户名 (必填)</label>
            <input type="text" name="username" class="form-control" placeholder="请输入您的登录账号" required>
        </div>
        <div class="form-group">
            <label>密码 (必填)</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label>昵称 (选填)</label>
            <input type="text" name="nickname" class="form-control" placeholder="请输入您的昵称">
        </div>
        <div class="form-group">
            <label>QQ邮箱 (选填，用于接收通知)</label>
            <input type="email" name="email" class="form-control" placeholder="例如: 123456@qq.com">
        </div>

        <button type="submit" class="btn-submit">注 册</button>
    </form>

    <a href="/login" class="login-link">← 已有账号？返回登录</a>
</div>
</body>
</html>
