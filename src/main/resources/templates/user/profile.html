<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 校园二手闲置交易平台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); background-attachment: fixed; color: #e2e8f0; min-height: 100vh; }
        .navbar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 40px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 20px; color: #fff; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; font-size: 14px; }
        .nav-links a { text-decoration: none; color: rgba(255,255,255,0.7); transition: color 0.2s; }
        .nav-links a:hover { color: #fff; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .profile-card { background: rgba(30, 41, 59, 0.8); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #3b82f6; display: flex; justify-content: center; align-items: center; font-size: 40px; color: white; font-weight: bold; border: 3px solid #60a5fa; object-fit: cover;}
        .info h2 { font-size: 24px; color: #fff; margin-bottom: 5px; }
        .info p { color: #94a3b8; font-size: 14px; margin-bottom: 5px; }
        .info .tag { color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
        .section-title { font-size: 20px; color: #f8fafc; border-left: 4px solid #3b82f6; padding-left: 10px; margin-bottom: 20px;}
        .goods-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .goods-item { background: rgba(30, 41, 59, 0.8); border-radius: 12px; padding: 15px; display: flex; gap: 15px; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .goods-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .goods-info { flex: 1; }
        .goods-info h4 { color: #f8fafc; font-size: 16px; margin-bottom: 5px; }
        .goods-info .price { color: #ef4444; font-weight: bold; font-size: 15px; }
        .btn-edit { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; transition: all 0.2s; }
        .btn-edit:hover { background: #3b82f6; color: white; }
        .btn-delete { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .btn-delete:hover { background: #ef4444; color: white; }
        .form-card { background: rgba(30, 41, 59, 0.8); border-radius: 16px; padding: 25px; margin-top: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #cbd5e1; margin-bottom: 8px; font-size: 14px; }
        .form-control { width: 100%; padding: 12px 15px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; outline: none; }
        .form-control:focus { border-color: #3b82f6; }
        .btn-submit { background: #3b82f6; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #2563eb; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .alert-error { background: rgba(239, 68,68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
        /* 评价展示样式 */
        .review-item { background: rgba(15, 23, 42, 0.6); padding: 15px; border-radius: 12px; margin-top: 15px; border-left: 4px solid #f59e0b; }
        .review-stars { color: #f59e0b; margin-bottom: 8px; }
        .review-content { color: #e2e8f0; font-size: 14px; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/goods/" style="text-decoration: none;"><h1>校园二手闲置交易平台</h1></a>
    <div class="nav-links">
        <a href="/goods/">返回首页</a>
        <a href="/logout">退出登录</a>
    </div>
</div>

<div class="container">
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <div class="profile-card">
        <img th:if="${user.avatar != null and user.avatar != ''}" th:src="${user.avatar}" class="avatar" alt="头像" />
        <div th:if="${user.avatar == null or user.avatar == ''}" class="avatar" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">A</div>

        <div class="info">
            <h2>
                <span th:text="${user.nickname != null ? user.nickname : user.username}">用户昵称</span>
                <span class="tag" th:if="${user.role == 'ADMIN'}" style="background:#ef4444;">超级管理员</span>
                <span class="tag" th:if="${user.role == 'SELLER'}" style="background:#f59e0b;">认证卖家</span>
                <span class="tag" th:if="${user.role == 'USER'}" style="background:#3b82f6;">普通用户</span>
            </h2>
            <p>账号：<span th:text="${user.username}"></span></p>
            <p>邮箱：<span th:text="${user.email != null ? user.email : '未绑定'}"></span></p>

            <!-- 信用分展示 -->
            <div style="margin-top: 10px;">
                <span style="color: #f59e0b; font-weight: bold; font-size: 18px;">
                    ⭐ <span th:text="${user.ratingAvg != null ? user.ratingAvg : '5.0'}"></span> 分
                </span>
                <span style="color: #64748b; font-size: 12px; margin-left: 10px;">
                    (共 <span th:text="${user.reviewCount != null ? user.reviewCount : '0'}"></span> 条评价)
                </span>
            </div>
        </div>
    </div>

    <!-- 申请成为卖家 -->
    <div th:if="${user.role == 'USER'}" style="text-align: center; margin-bottom: 30px;">
        <form action="/user/becomeSeller" method="post">
            <button type="submit" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transition: all 0.3s;">
                🚀 立即申请成为认证卖家
            </button>
        </form>
    </div>

    <div class="form-card" style="margin-bottom: 30px;">
        <h3 class="section-title">✏️ 修改个人信息</h3>
        <form action="/user/uploadAvatar" method="post" enctype="multipart/form-data" style="margin-top: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed rgba(255,255,255,0.1);">
            <div class="form-group">
                <label>更换头像</label>
                <input type="file" name="avatarFile" class="form-control" style="padding: 8px;" required>
            </div>
            <button type="submit" class="btn-submit" style="background:#8b5cf6;">上传头像</button>
        </form>

        <form action="/user/updateProfile" method="post">
            <div class="form-group">
                <label>昵称</label>
                <input type="text" name="nickname" class="form-control" th:value="${user.nickname}" required placeholder="请输入昵称">
            </div>
            <div class="form-group">
                <label>QQ邮箱 (选填)</label>
                <input type="email" name="email" class="form-control" th:value="${user.email}" placeholder="填写邮箱可接收留言通知">
            </div>
            <button type="submit" class="btn-submit" style="background:#10b981;">保存修改</button>
        </form>
    </div>

    <h3 class="section-title">📦 我发布的物品</h3>

    <div class="goods-list" th:if="${myGoods.size() > 0}">
        <div class="goods-item" th:each="goods : ${myGoods}">
            <!-- 🚨 修复：使用更安全的写法，避免因为找不到 imageUrl 而崩溃 -->
            <img th:if="${goods['imageUrl'] != null}" th:src="${goods['imageUrl']}" />
            <img th:if="${goods['imageUrl'] == null}" src="https://via.placeholder.com/80?text=No+Img" />

            <div class="goods-info">
                <h4 th:text="${goods['title']}">物品标题</h4>
                <div class="price">￥<span th:text="${goods['price']}">0.00</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <a th:href="@{/goods/edit/{id}(id=${goods['id']})}" class="btn-edit" style="text-align: center;">编辑</a>
                <form action="/goods/delete" method="post" onsubmit="return confirm('确定要下架并删除该物品吗？');">
                    <input type="hidden" name="goodsId" th:value="${goods['id']}">
                    <button type="submit" class="btn-delete" style="width: 100%;">下架</button>
                </form>
            </div>
        </div>
    </div>
    <p th:if="${myGoods.size() == 0}" style="color: #64748b; margin-top: 15px;">你还没有发布过物品哦~</p>

    <div class="form-card">
        <h3 class="section-title">🔒 修改密码</h3>
        <form action="/user/changePassword" method="post" style="margin-top: 20px;">
            <div class="form-group">
                <label>原密码</label>
                <input type="password" name="oldPassword" class="form-control" required placeholder="请输入当前密码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="newPassword" class="form-control" required placeholder="请输入新密码（至少6位）" minlength="6">
            </div>
            <button type="submit" class="btn-submit">确认修改</button>
        </form>
    </div>
</div>

</body>
</html>
